name: invezzte
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  go_router: ^17.2.1
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  get_it: ^8.0.0
  http: ^1.6.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.0+3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_invezzte.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/icon_invezzte.png
    - assets/images/background_login.png
    - assets/images/logo.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700